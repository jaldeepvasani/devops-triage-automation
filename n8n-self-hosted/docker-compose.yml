services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-devops-triage
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_WEBHOOK_URL=https://sleeps-multi-org-advertising.trycloudflare.com/
      - WEBHOOK_URL=https://sleeps-multi-org-advertising.trycloudflare.com/
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: